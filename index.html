<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D ASCII Gyro Space</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: black; 
            color: #00ff00; /* 사이버펑크 터미널 느낌의 그린 */
            font-family: monospace;
        }
        /* 불필요한 장식을 뺀 최소한의 레이아웃 */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 999;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: monospace;
            background-color: transparent;
            color: #00ff00;
            border: 1px solid #00ff00;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #00ff00;
            color: black;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="startBtn">시스템 접속 (자이로 활성화)</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';
        import { DeviceOrientationControls } from 'three/addons/controls/DeviceOrientationControls.js';

        let camera, scene, renderer, effect, controls;
        let mechanicalObject;

        const startBtn = document.getElementById('startBtn');
        const overlay = document.getElementById('overlay');

        // iOS 등 최신 모바일 브라우저의 센서 권한 요청 로직
        startBtn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            init();
                            overlay.style.display = 'none';
                        } else {
                            alert('자이로센서 권한이 필요합니다.');
                        }
                    })
                    .catch(console.error);
            } else {
                init();
                overlay.style.display = 'none';
            }
        });

        function init() {
            // 1. 씬 및 카메라 세팅
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 500;

            // 2. 기계적인 형태의 3D 오브젝트 생성 (TorusKnot)
            const geometry = new THREE.TorusKnotGeometry(120, 40, 100, 16);
            const material = new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true });
            mechanicalObject = new THREE.Mesh(geometry, material);
            scene.add(mechanicalObject);

            // 3. 조명 (아스키 효과는 빛의 명암에 따라 문자가 결정됨)
            const light1 = new THREE.PointLight(0xffffff, 3, 0, 0);
            light1.position.set(500, 500, 500);
            scene.add(light1);

            const light2 = new THREE.PointLight(0xffffff, 1, 0, 0);
            light2.position.set(-500, -500, -500);
            scene.add(light2);

            // 4. 렌더러 설정
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);

            // 5. 아스키 이펙트 적용 (빛이 밝을수록 촘촘한 문자 배치)
            effect = new AsciiEffect(renderer, ' .:-+*=%@#', { invert: true });
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.domElement.style.color = '#00ff00';
            effect.domElement.style.backgroundColor = 'black';
            document.body.appendChild(effect.domElement);

            // 6. 자이로센서 컨트롤 연결
            controls = new DeviceOrientationControls(camera);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // 오브젝트 자체도 천천히 회전시켜 생동감 부여
            mechanicalObject.rotation.x += 0.005;
            mechanicalObject.rotation.y += 0.01;
            
            // 기기 기울기에 따라 카메라 시점 업데이트
            controls.update(); 
            
            effect.render(scene, camera);
        }
    </script>
</body>
</html>
