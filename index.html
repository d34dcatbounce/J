<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sella: The Infinite Core</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: black; touch-action: none; cursor: grab; }
        body:active { cursor: grabbing; }
        #overlay {
            position: fixed; top: 30px; left: 30px;
            color: #00ff00; font-family: 'Courier New', Courier, monospace;
            font-size: 12px; letter-spacing: 1px; z-index: 100; pointer-events: none;
            text-transform: uppercase; line-height: 1.8;
        }
    </style>
</head>
<body>

    <div id="overlay">
        [ SYSTEM_LOG: ACCESS_GRANTED ]<br>
        LOC: SELLA_INTERIOR_DOME<br>
        MODE: TOTAL_SPHERICAL_VIEW<br>
        OBJECTS: MECHANICAL_ARTIFACTS_LOADED
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

        let scene, camera, renderer, effect;
        
        // 구면 좌표계 변수 (회전 꼬임 방지)
        let lon = 0, lat = 0;
        let phi = 0, theta = 0;
        let onPointerDownLon = 0, onPointerDownLat = 0;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
        let isDragging = false;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 1, 1100);
            camera.target = new THREE.Vector3(0, 0, 0);

            // --- 조형물 배치 (기계적 세계관) ---
            const createComplexObject = () => {
                const group = new THREE.Group();
                
                // 1. 거대한 꼬인 고리 (TorusKnot)
                const coreGeo = new THREE.TorusKnotGeometry(2, 0.6, 64, 8);
                const mat = new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true });
                const core = new THREE.Mesh(coreGeo, mat);
                group.add(core);

                // 2. 주변을 감싸는 보조 링
                const ringGeo = new THREE.TorusGeometry(4, 0.1, 16, 100);
                const ring = new THREE.Mesh(ringGeo, mat);
                ring.rotation.x = Math.PI / 2;
                group.add(ring);

                return group;
            };

            // 공간 곳곳에 15개의 대형 구조물 배치
            for (let i = 0; i < 15; i++) {
                const obj = createComplexObject();
                const dist = 30 + Math.random() * 20;
                const angle1 = Math.random() * Math.PI * 2;
                const angle2 = Math.random() * Math.PI;

                obj.position.set(
                    dist * Math.sin(angle2) * Math.cos(angle1),
                    dist * Math.sin(angle2) * Math.sin(angle1),
                    dist * Math.cos(angle2)
                );
                obj.rotation.set(Math.random() * 5, Math.random() * 5, Math.random() * 5);
                scene.add(obj);
            }

            // 작은 파편들(기둥, 박스) 추가
            const pGeo = new THREE.CylinderGeometry(0.2, 0.2, 10, 6);
            for (let i = 0; i < 50; i++) {
                const pillar = new THREE.Mesh(pGeo, new THREE.MeshPhongMaterial({ color: 0xffffff }));
                const dist = 25 + Math.random() * 15;
                const a1 = Math.random() * Math.PI * 2;
                const a2 = Math.random() * Math.PI;
                pillar.position.set(dist * Math.sin(a2) * Math.cos(a1), dist * Math.sin(a2) * Math.sin(a1), dist * Math.cos(a2));
                pillar.lookAt(0,0,0);
                scene.add(pillar);
            }

            // 3. 조명 (카메라 위치의 점광원)
            const light = new THREE.PointLight(0xffffff, 1500);
            scene.add(light);
            const ambient = new THREE.AmbientLight(0x404040); // 최소한의 형태 감지
            scene.add(ambient);

            // 4. 아스키 렌더러
            renderer = new THREE.WebGLRenderer();
            effect = new AsciiEffect(renderer, ' .:-+*=%@#', { invert: true });
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.domElement.style.color = '#00ff00';
            effect.domElement.style.backgroundColor = 'black';
            document.body.appendChild(effect.domElement);

            // 5. 드래그 이벤트 (구면 좌표 누적 로직)
            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            window.addEventListener('resize', onWindowResize);
        }

        function onPointerDown(e) {
            isDragging = true;
            onPointerDownPointerX = e.clientX;
            onPointerDownPointerY = e.clientY;
            onPointerDownLon = lon;
            onPointerDownLat = lat;
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            // 감도 조절 (0.1)
            lon = (onPointerDownPointerX - e.clientX) * 0.1 + onPointerDownLon;
            lat = (e.clientY - onPointerDownPointerY) * 0.1 + onPointerDownLat;
        }

        function onPointerUp() { isDragging = false; }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 수직 회전 각도 제한 (머리 꼭대기에서 시야가 뒤집히는 것 방지)
            lat = Math.max(-89.9, Math.min(89.9, lat));
            
            // 경도/위도를 3D 좌표(Vector3)로 변환하여 카메라 시선 처리
            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
            camera.target.y = 500 * Math.cos(phi);
            camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);
            camera.lookAt(camera.target);

            effect.render(scene, camera);
        }
    </script>
</body>
</html>
