<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sella: 360 Dome Interface</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: black; touch-action: none; cursor: grab;
        }
        body:active { cursor: grabbing; }
        #overlay {
            position: fixed; top: 20px; left: 20px;
            color: #00ff00; font-family: monospace; font-size: 11px;
            letter-spacing: 1px; z-index: 100; pointer-events: none;
            text-transform: uppercase; opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="overlay">
        SYSTEM: FULL_SPHERICAL_SCAN<br>
        VIEWPORT: 360_DEGREE_DOME<br>
        STATUS: UNRESTRICTED_ROTATION
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

        let scene, camera, renderer, effect;
        let targetRotationX = 0, targetRotationY = 0;
        let isDragging = false;
        let prevX = 0, prevY = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            // 시야각을 조금 더 넓혀서(85도) 돔 내부의 광활함을 강조
            camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0.1); 

            // 1. 구체 공간을 촘촘히 채우는 '데이터 입자'들
            // 구 형태(Sphere)를 따라 오브젝트를 배치하여 돔 느낌 극대화
            const geo = new THREE.IcosahedronGeometry(1, 0);
            for (let i = 0; i < 300; i++) {
                const mat = new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true });
                const mesh = new THREE.Mesh(geo, mat);
                
                // 완전히 무작위한 구체 좌표 배치
                const phi = Math.acos(-1 + (2 * i) / 300);
                const theta = Math.sqrt(300 * Math.PI) * phi;
                const r = 30 + Math.random() * 10;

                mesh.position.set(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
                mesh.rotation.set(Math.random(), Math.random(), Math.random());
                scene.add(mesh);
            }

            // 2. 조명 (카메라 위치에서 360도로 뻗어나가는 빛)
            const light = new THREE.PointLight(0xffffff, 1000, 100);
            camera.add(light);
            scene.add(camera);

            // 3. 아스키 렌더러
            renderer = new THREE.WebGLRenderer();
            effect = new AsciiEffect(renderer, ' .:-+*=%@#', { invert: true });
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.domElement.style.color = '#00ff00';
            effect.domElement.style.backgroundColor = 'black';
            document.body.appendChild(effect.domElement);

            // 4. 무제한 드래그 이벤트 (Delta 방식)
            window.addEventListener('pointerdown', (e) => {
                isDragging = true;
                prevX = e.clientX;
                prevY = e.clientY;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                
                // 이동량 계산
                const dx = e.clientX - prevX;
                const dy = e.clientY - prevY;

                // 회전값 누적 (제한 없음)
                targetRotationY += dx * 0.004;
                targetRotationX += dy * 0.004;

                prevX = e.clientX;
                prevY = e.clientY;
            });

            window.addEventListener('pointerup', () => isDragging = false);
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 카메라의 회전값에 부드러운 관성 적용 (Lerp)
            // 어느 방향으로든 무한히 회전 가능
            camera.rotation.y += (targetRotationY - camera.rotation.y) * 0.1;
            camera.rotation.x += (targetRotationX - camera.rotation.x) * 0.1;

            effect.render(scene, camera);
        }
    </script>
</body>
</html>
