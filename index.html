<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sella: ASCII Spatial Interface</title>
    <style>
        /* 불필요한 스크롤바 제거 및 전체 레이아웃 설정 */
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            background-color: black; 
            touch-action: none; /* 브라우저 기본 터치 동작(스크롤 등) 방지 */
            cursor: grab;
        }
        body:active { cursor: grabbing; }

        /* 시스템 정보 오버레이 (디자인 포인트) */
        #overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.6;
            pointer-events: none;
            z-index: 100;
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* 아스키 렌더링 결과물이 들어갈 컨테이너 */
        #ascii-viewport {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="overlay">
        STATUS: CONNECTED<br>
        SELLA_CORE_OBSERVATION_MODE<br>
        DRAG TO ROTATE VIEWPORT
    </div>

    <div id="ascii-viewport"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

        let scene, camera, renderer, effect;
        
        // 시점 제어를 위한 변수 (누적 방식)
        let targetRotationX = 0;
        let targetRotationY = 0;
        let isDragging = false;
        let previousPointerX = 0;
        let previousPointerY = 0;

        init();
        animate();

        function init() {
            // 1. 씬 및 카메라 설정 (카메라가 공간 중심)
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 0, 0.1); // 중심에서 밖을 바라봄

            // 2. 가상 공간을 채울 오브젝트들 (기계적 파편 느낌)
            const geometries = [
                new THREE.IcosahedronGeometry(1.5, 0),
                new THREE.TorusGeometry(3, 0.1, 8, 50),
                new THREE.BoxGeometry(1, 1, 1)
            ];

            for (let i = 0; i < 120; i++) {
                const material = new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true });
                const mesh = new THREE.Mesh(geometries[Math.floor(Math.random() * geometries.length)], material);
                
                // 카메라 주변 구형 배치
                const radius = 15 + Math.random() * 25;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                
                mesh.position.set(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.sin(phi) * Math.sin(theta),
                    radius * Math.cos(phi)
                );
                
                mesh.rotation.set(Math.random() * 2, Math.random() * 2, Math.random() * 2);
                scene.add(mesh);
            }

            // 3. 조명 (카메라와 같이 움직이는 시선 조명)
            const light = new THREE.PointLight(0xffffff, 800);
            camera.add(light);
            scene.add(camera);

            // 4. 아스키 효과 렌더러 설정
            renderer = new THREE.WebGLRenderer();
            effect = new AsciiEffect(renderer, ' .:-+*=%@#', { invert: true });
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.domElement.style.color = '#00ff00';
            effect.domElement.style.backgroundColor = 'black';
            document.getElementById('ascii-viewport').appendChild(effect.domElement);

            // 5. 드래그/터치 이벤트 리스너 (누적 방식 로직)
            window.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousPointerX = e.clientX;
                previousPointerY = e.clientY;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;

                const deltaX = e.clientX - previousPointerX;
                const deltaY = e.clientY - previousPointerY;

                // 회전값 누적 (감도 0.005)
                targetRotationY += deltaX * 0.005;
                targetRotationX += deltaY * 0.005;

                // 상하 시선 제한 (90도 이상 꺾이지 않게)
                targetRotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotationX));

                previousPointerX = e.clientX;
                previousPointerY = e.clientY;
            });

            window.addEventListener('pointerup', () => {
                isDragging = false;
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 부드러운 시선 이동 효과 (Lerp)
            camera.rotation.y += (targetRotationY - camera.rotation.y) * 0.15;
            camera.rotation.x += (targetRotationX - camera.rotation.x) * 0.15;

            effect.render(scene, camera);
        }
    </script>
</body>
</html>
