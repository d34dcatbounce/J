<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ASCII Free-Look Space</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; cursor: grab; }
        body:active { cursor: grabbing; }
        #info {
            position: fixed;
            top: 20px; width: 100%;
            text-align: center;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="info">Drag to Look Around / Spatial Interface</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

        let scene, camera, renderer, effect;
        let targetRotationX = 0, targetRotationY = 0;
        let mouseX = 0, mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 0, 0.1); // 내부에서 밖을 보는 시점

            // 1. 공간을 채울 '기계적 잔해'들 무작위 배치
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const torusGeo = new THREE.TorusGeometry(3, 0.2, 16, 100);

            for (let i = 0; i < 150; i++) {
                const material = new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true });
                const mesh = new THREE.Mesh(Math.random() > 0.5 ? boxGeo : torusGeo, material);
                
                // 카메라(나)를 중심으로 구형으로 퍼뜨림
                const r = 15 + Math.random() * 20;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                
                mesh.position.set(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
                mesh.rotation.set(Math.random() * 5, Math.random() * 5, Math.random() * 5);
                scene.add(mesh);
            }

            // 2. 조명 (카메라와 함께 이동하는 헤드라이트 느낌)
            const light = new THREE.PointLight(0xffffff, 1000);
            camera.add(light);
            scene.add(camera);

            // 3. 아스키 렌더러
            renderer = new THREE.WebGLRenderer();
            effect = new AsciiEffect(renderer, ' .:-+*=%@#', { invert: true });
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.domElement.style.color = '#00ff00';
            effect.domElement.style.backgroundColor = 'black';
            document.body.appendChild(effect.domElement);

            // 4. 이벤트 리스너 (마우스/터치 드래그)
            document.addEventListener('pointermove', onPointerMove);
            window.addEventListener('resize', onWindowResize);
        }

        function onPointerMove(event) {
            if (event.isPrimary) {
                // 화면 중앙으로부터 얼마나 떨어졌는지를 계산하여 회전값으로 변환
                mouseX = (event.clientX - windowHalfX);
                mouseY = (event.clientY - windowHalfY);
            }
        }

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 5. 부드러운 시선 이동 (Lerp 기법)
            // 타겟 회전값에 서서히 다가가도록 설정해 AR의 고개 돌림을 흉내냄
            targetRotationY += (mouseX * 0.0005 - targetRotationY) * 0.05;
            targetRotationX += (mouseY * 0.0005 - targetRotationX) * 0.05;

            camera.rotation.y = -targetRotationY * 5;
            camera.rotation.x = -targetRotationX * 5;

            effect.render(scene, camera);
        }
    </script>
</body>
</html>
