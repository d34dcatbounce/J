<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1st Person ASCII View</title>
    <style>
        body { margin: 0; background: #000; color: #00ff00; font-family: monospace; overflow-x: hidden; }
        #container { height: 800vh; position: relative; } /* 스크롤 길이를 넉넉히 주어 회전각 확보 */
        #view {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
        }
        #info {
            position: fixed;
            top: 20px; left: 20px;
            font-size: 0.7rem;
            line-height: 1.5;
            opacity: 0.5;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="info">
            System: Observing_Sella_Core<br>
            Mode: 1st_Person_Rotation<br>
            Input: Scroll_to_Scan
        </div>
        <div id="view"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

        let scene, camera, renderer, effect;
        const objects = [];

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // 카메라를 중심에 배치 (1인칭 시점의 눈)
            camera.position.set(0, 0, 0);

            // 주변에 흩뿌려진 '기계적' 오브젝트들 생성
            const geometries = [
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.TorusGeometry(2, 0.5, 8, 20),
                new THREE.OctahedronGeometry(1.5)
            ];

            for (let i = 0; i < 100; i++) {
                const material = new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true });
                const mesh = new THREE.Mesh(geometries[Math.floor(Math.random() * geometries.length)], material);
                
                // 카메라 주변으로 무작위 배치
                const distance = 10 + Math.random() * 15;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI * 2;
                
                mesh.position.set(
                    distance * Math.sin(theta) * Math.cos(phi),
                    distance * Math.sin(theta) * Math.sin(phi),
                    distance * Math.cos(theta)
                );
                
                mesh.rotation.set(Math.random() * 2, Math.random() * 2, Math.random() * 2);
                scene.add(mesh);
                objects.push(mesh);
            }

            const light = new THREE.PointLight(0xffffff, 500);
            light.position.set(0, 0, 0); // 카메라 위치에서 빛이 뻗어나가도록 설정
            scene.add(light);

            renderer = new THREE.WebGLRenderer();
            effect = new AsciiEffect(renderer, ' .:-+*=%@#', { invert: true });
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.domElement.style.color = '#00ff00';
            effect.domElement.style.backgroundColor = 'black';
            document.getElementById('view').appendChild(effect.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const scrollPercent = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);

            // 핵심: 스크롤에 따라 카메라의 회전(Y축 - 도리도리, X축 - 끄덕끄덕) 제어
            camera.rotation.y = scrollPercent * Math.PI * 4; // 두 바퀴 회전
            camera.rotation.x = Math.sin(scrollPercent * Math.PI) * 0.5; // 살짝 위아래로 훑는 움직임

            // 오브젝트들도 미세하게 움직여 생동감 부여
            objects.forEach(obj => {
                obj.rotation.x += 0.002;
                obj.rotation.y += 0.001;
            });

            effect.render(scene, camera);
        }
    </script>
</body>
</html>
