<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Scroll Space</title>
    <style>
        body { margin: 0; background: #000; color: #00ff00; font-family: monospace; overflow-x: hidden; }
        
        /* 스크롤 길이를 만들어 시야 이동감을 부여 */
        #container { height: 500vh; position: relative; }
        
        /* 화면에 고정된 캔버스 */
        #view {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        /* 중앙 안내 문구 */
        #hint {
            position: fixed;
            bottom: 20px; width: 100%;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.6;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="view"></div>
        <div id="hint">SCROLL TO DIVE INTO THE MACHINE</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

        let scene, camera, renderer, effect, mesh;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // 기하학적 착시를 주는 구조물 (Icosahedron)
            const geometry = new THREE.IcosahedronGeometry(2, 1);
            const material = new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true, wireframe: false });
            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // 주변에 흩뿌려진 입자들 (공간감 극대화)
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 500;
            const posArray = new Float32Array(starsCount * 3);
            for(let i = 0; i < starsCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 20;
            }
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starsMaterial = new THREE.PointsMaterial({ size: 0.05, color: 0xffffff });
            const starMesh = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starMesh);

            const light = new THREE.PointLight(0xffffff, 100);
            light.position.set(5, 5, 5);
            scene.add(light);

            renderer = new THREE.WebGLRenderer();
            
            // 아스키 효과 설정
            effect = new AsciiEffect(renderer, ' .:-+*=%@#', { invert: true });
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.domElement.style.color = '#00ff00';
            effect.domElement.style.backgroundColor = 'black';
            document.getElementById('view').appendChild(effect.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 스크롤 양 계산 (0 ~ 1)
            const scrollPercent = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);

            // 1. 시각적 착시: 스크롤에 따라 오브젝트 회전 및 줌인
            mesh.rotation.y = scrollPercent * Math.PI * 4;
            mesh.rotation.x = scrollPercent * Math.PI * 2;
            camera.position.z = 5 - (scrollPercent * 4); // 안으로 빨려 들어가는 효과

            // 2. 카메라 시야각 왜곡 (착시 효과 극대화)
            camera.fov = 75 + (scrollPercent * 40); 
            camera.updateProjectionMatrix();

            effect.render(scene, camera);
        }
    </script>
</body>
</html>
